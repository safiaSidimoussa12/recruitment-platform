<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — JobBoard'">JobBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
            --dark: #0f172a;
            --muted: #64748b;
            --surface: #f8fafc;
            --card-shadow: 0 4px 24px rgba(99,102,241,0.08);
            --card-shadow-hover: 0 8px 40px rgba(99,102,241,0.18);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--surface);
            color: var(--dark);
            min-height: 100vh;
        }

        /* ── Navbar ── */
        .navbar-jobboard {
            background: var(--gradient);
            padding: 12px 0;
            box-shadow: 0 2px 20px rgba(99,102,241,0.3);
        }

        .navbar-brand-custom {
            font-size: 1.5rem;
            font-weight: 800;
            color: white !important;
            letter-spacing: -0.5px;
        }

        .navbar-brand-custom span {
            background: rgba(255,255,255,0.25);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 2px;
        }

        .nav-link-custom {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 500;
            padding: 6px 14px !important;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-link-custom:hover {
            color: white !important;
            background: rgba(255,255,255,0.15);
        }

        .btn-nav-logout {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-nav-logout:hover {
            background: rgba(255,255,255,0.35);
            color: white;
        }

        /* ── Cards ── */
        .card-modern {
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            background: white;
        }

        .card-modern:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
        }

        /* ── Badges ── */
        .badge-contract {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-city {
            background: linear-gradient(135deg, #06b6d4, #0ea5e9);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-status-pending {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-status-accepted {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-status-refused {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* ── Buttons ── */
        .btn-primary-custom {
            background: var(--gradient);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(99,102,241,0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99,102,241,0.4);
            color: white;
        }

        .btn-outline-custom {
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
            background: transparent;
            transition: all 0.2s;
        }

        .btn-outline-custom:hover {
            background: var(--gradient);
            border-color: transparent;
            color: white;
        }

        /* ── Hero ── */
        .hero-section {
            background: var(--gradient);
            padding: 60px 0 80px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -5%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        /* ── Search ── */
        .search-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }

        .form-control-modern {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .form-control-modern:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            outline: none;
        }

        .form-select-modern {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .form-select-modern:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        /* ── Auth cards ── */
        .auth-wrapper {
            min-height: 100vh;
            background: var(--gradient-soft);
            display: flex;
            align-items: center;
        }

        .auth-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(99,102,241,0.15);
            overflow: hidden;
        }

        .auth-header {
            background: var(--gradient);
            padding: 32px;
            text-align: center;
            color: white;
        }

        /* ── Stats ── */
        .stat-card {
            border-radius: 16px;
            padding: 24px;
            color: white;
            text-align: center;
        }

        /* ── Footer ── */
        .footer-custom {
            background: var(--dark);
            color: rgba(255,255,255,0.6);
            padding: 24px 0;
            margin-top: 80px;
            text-align: center;
            font-size: 0.875rem;
        }

        /* ── Page header ── */
        .page-header {
            background: var(--gradient-soft);
            border-bottom: 1px solid #e2e8f0;
            padding: 32px 0;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-weight: 800;
            font-size: 1.8rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Table ── */
        .table-modern thead {
            background: var(--gradient);
            color: white;
        }

        .table-modern thead th {
            border: none;
            font-weight: 600;
            padding: 14px 16px;
        }

        .table-modern tbody tr {
            transition: all 0.15s;
        }

        .table-modern tbody tr:hover {
            background: #f8faff;
        }

        .table-modern td {
            padding: 14px 16px;
            vertical-align: middle;
            border-color: #f1f5f9;
        }
    </style>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-jobboard">
    <div class="container">
        <a class="navbar-brand-custom" th:href="@{/offres}">
            Job<span>Board</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" style="color:white">
            <i class="bi bi-list fs-4"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link-custom" th:href="@{/offres}">
                        <i class="bi bi-briefcase me-1"></i>Jobs
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link-custom" th:href="@{/login}">Sign In</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link-custom" th:href="@{/register}">Register</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link-custom" th:href="@{/offres}">
                        <i class="bi bi-briefcase me-1"></i>Jobs
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link-custom" th:href="@{/candidat/candidatures}">
                        <i class="bi bi-file-text me-1"></i>Applications
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link-custom" th:href="@{/candidat/favoris}">
                        <i class="bi bi-bookmark me-1"></i>Saved
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link-custom" th:href="@{/candidat/profil}">
                        <i class="bi bi-person me-1"></i>Profile
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('RECRUTEUR')">
                    <a class="nav-link-custom" th:href="@{/recruteur/offres}">
                        <i class="bi bi-briefcase me-1"></i>My Jobs
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('RECRUTEUR')">
                    <a class="nav-link-custom" th:href="@{/recruteur/profil}">
                        <i class="bi bi-person me-1"></i>Profile
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link-custom" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link-custom" th:href="@{/admin/utilisateurs}">Users</a>
                </li>

                <li class="nav-item ms-2" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn-nav-logout">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</html>
