<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: 'JobBoard'">JobBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/offres}">JobBoard</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Connexion</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">S'inscrire</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link" th:href="@{/candidat/profil}">Mon profil</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link" th:href="@{/candidat/candidatures}">Mes candidatures</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CANDIDAT')">
                    <a class="nav-link" th:href="@{/candidat/favoris}">Favoris</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('RECRUTEUR')">
                    <a class="nav-link" th:href="@{/recruteur/offres}">Mes offres</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('RECRUTEUR')">
                    <a class="nav-link" th:href="@{/recruteur/profil}">Mon profil</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>
    <div th:if="${param.success}" class="alert alert-success">Opération réussie.</div>
    <div th:if="${param.registered}" class="alert alert-success">
        Compte créé avec succès. Connectez-vous.
    </div>
    <th:block th:fragment="content"></th:block>
</main>

<footer class="text-center text-muted py-4 mt-5 border-top">
    <small>JobBoard © 2026</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
