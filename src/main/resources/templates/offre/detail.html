<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title th:text="${offre.titre}">Offre</title></head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>
<main class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h2 th:text="${offre.titre}"></h2>
            <p class="text-muted">
                <span th:text="${offre.entreprise.nom}"></span> —
                <span th:text="${offre.ville}"></span>
            </p>
            <span class="badge bg-info text-dark me-2"
                  th:text="${offre.typeContrat}"></span>
            <span th:if="${offre.salaireMin}" class="badge bg-success">
                À partir de <span th:text="${offre.salaireMin}"></span> DA
            </span>

            <hr/>
            <h5>Description</h5>
            <p th:text="${offre.description}"></p>

            <hr/>
            <!-- Postuler -->
            <div sec:authorize="hasRole('CANDIDAT')">
                <h5>Postuler à cette offre</h5>
                <form th:action="@{/candidatures}" method="post">
                    <input type="hidden" name="offreId" th:value="${offre.id}"/>
                    <div class="mb-3">
                        <label class="form-label">Lettre de motivation (optionnelle)</label>
                        <textarea name="lettreMotivation" class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Postuler</button>
                </form>
            </div>

            <!-- Favori -->
            <div sec:authorize="hasRole('CANDIDAT')" class="mt-3">
                <form th:action="@{/candidat/favoris/toggle}" method="post">
                    <input type="hidden" name="offreId" th:value="${offre.id}"/>
                    <button type="submit" class="btn btn-outline-warning">
                        ★ Sauvegarder en favori
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title"
                        th:text="${offre.entreprise.nom}"></h5>
                    <p th:text="${offre.entreprise.description}"></p>
                    <p><strong>Secteur :</strong>
                        <span th:text="${offre.entreprise.secteur}"></span></p>
                    <p><strong>Localisation :</strong>
                        <span th:text="${offre.entreprise.localisation}"></span></p>
                    <a th:href="${offre.entreprise.siteWeb}"
                       target="_blank" class="btn btn-outline-primary btn-sm">
                        Site web
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
