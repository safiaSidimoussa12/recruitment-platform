<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My Job Listings')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1>My Job Listings</h1>
            <p class="text-muted mb-0">Manage your published positions</p>
        </div>
        <a th:href="@{/recruteur/offres/new}" class="btn-primary-custom">
            <i class="bi bi-plus-lg me-2"></i>Post a Job
        </a>
    </div>
</div>

<div class="container mb-5">
    <div th:if="${offres.isEmpty()}" class="text-center py-5">
        <i class="bi bi-briefcase fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No job listings yet</h5>
        <a th:href="@{/recruteur/offres/new}" class="btn-primary-custom d-inline-block mt-2">
            Post Your First Job
        </a>
    </div>

    <div class="row g-3" th:unless="${offres.isEmpty()}">
        <div class="col-12" th:each="offre : ${offres}">
            <div class="card-modern card p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-1" th:text="${offre.titre}"></h6>
                        <div class="d-flex gap-2 mt-2">
                            <span class="badge-city" th:if="${offre.ville}"
                                  th:text="${offre.ville}"></span>
                            <span class="badge-contract"
                                  th:text="${offre.typeContrat}"></span>
                            <span th:if="${offre.statut.name() == 'PUBLIEE'}"
                                  class="badge-status-accepted">Active</span>
                            <span th:if="${offre.statut.name() == 'CLOTUREE'}"
                                  class="badge" style="background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:20px;font-size:0.75rem">
                                Closed
                            </span>
                            <span th:if="${offre.statut.name() == 'SUPPRIMEE'}"
                                  class="badge-status-refused">Deleted</span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/recruteur/offres/{id}/candidatures(id=${offre.id})}"
                           class="btn-primary-custom" style="padding:8px 16px;font-size:0.85rem">
                            <i class="bi bi-people me-1"></i>Applications
                        </a>
                        <a th:href="@{/recruteur/offres/{id}/edit(id=${offre.id})}"
                           class="btn-outline-custom" style="padding:8px 16px;font-size:0.85rem">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <form th:action="@{/recruteur/offres/{id}/supprimer(id=${offre.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-light border"
                                    style="border-radius:10px;padding:8px 14px"
                                    onclick="return confirm('Delete this job listing?')">
                                <i class="bi bi-trash text-danger"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
