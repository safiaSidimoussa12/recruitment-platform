<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Recruiter Profile')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>My Profile</h1>
        <p class="text-muted mb-0">Manage your recruiter information</p>
    </div>
</div>

<div class="container mb-5">
    <div th:if="${param.success}" class="alert border-0 rounded-3 mb-4"
         style="background:#f0fdf4; color:#16a34a;">
        <i class="bi bi-check-circle me-2"></i>Profile updated successfully.
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card-modern card p-4">
                <h5 class="fw-bold mb-4">
                    <i class="bi bi-person me-2" style="color:var(--primary)"></i>
                    Personal Information
                </h5>
                <form th:action="@{/recruteur/profil}" method="post" th:object="${recruteur}">
                    <div class="row">
                        <div class="col mb-3">
                            <label class="form-label text-muted small fw-600">FIRST NAME</label>
                            <input type="text" th:field="*{prenom}"
                                   class="form-control form-control-modern"/>
                        </div>
                        <div class="col mb-3">
                            <label class="form-label text-muted small fw-600">LAST NAME</label>
                            <input type="text" th:field="*{nom}"
                                   class="form-control form-control-modern"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-600">PHONE</label>
                        <input type="text" th:field="*{telephone}"
                               class="form-control form-control-modern"/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-600">COMPANY</label>
                        <input type="text" class="form-control form-control-modern" disabled
                               th:value="${recruteur.entreprise.nom}"/>
                    </div>
                    <button type="submit" class="btn-primary-custom">
                        <i class="bi bi-save me-2"></i>Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
