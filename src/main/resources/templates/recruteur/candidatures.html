<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Candidatures reçues</title></head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>
<main class="container mt-4">
    <h2>Candidatures reçues</h2>

    <div th:if="${candidatures.isEmpty()}" class="alert alert-info">
        Aucune candidature pour cette offre.
    </div>

    <div class="card mb-3" th:each="c : ${candidatures}">
        <div class="card-body">
            <h5 class="card-title"
                th:text="${c.candidat.nom + ' ' + c.candidat.prenom}"></h5>
            <p class="text-muted mb-1"
               th:text="${c.candidat.email}"></p>
            <span class="badge"
                  th:classappend="${c.statut.name() == 'ACCEPTEE'} ? 'bg-success' :
                                 (${c.statut.name() == 'REFUSEE'} ? 'bg-danger' : 'bg-warning text-dark')"
                  th:text="${c.statut}"></span>

            <div th:if="${c.lettreMotivation}" class="mt-2">
                <strong>Lettre de motivation :</strong>
                <p th:text="${c.lettreMotivation}"></p>
            </div>

            <div class="mt-3" th:if="${c.statut.name() == 'EN_ATTENTE'}">
                <form th:action="@{/recruteur/candidatures/{id}/traiter(id=${c.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" name="offreId" th:value="${offreId}"/>
                    <input type="hidden" name="statut" value="ACCEPTEE"/>
                    <button type="submit" class="btn btn-success btn-sm">Accepter</button>
                </form>
                <form th:action="@{/recruteur/candidatures/{id}/traiter(id=${c.id})}"
                      method="post" class="d-inline ms-2">
                    <input type="hidden" name="offreId" th:value="${offreId}"/>
                    <input type="hidden" name="statut" value="REFUSEE"/>
                    <button type="submit" class="btn btn-danger btn-sm">Refuser</button>
                </form>
                <a th:href="@{/messages/{id}(id=${c.id})}"
                   class="btn btn-outline-primary btn-sm ms-2">Contacter</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
