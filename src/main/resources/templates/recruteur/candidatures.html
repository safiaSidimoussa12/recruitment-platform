<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Applications Received')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1>Applications Received</h1>
            <p class="text-muted mb-0">Review and manage candidates</p>
        </div>
        <a th:href="@{/recruteur/offres}" class="btn-outline-custom">
            <i class="bi bi-arrow-left me-1"></i>Back to Jobs
        </a>
    </div>
</div>

<div class="container mb-5">
    <div th:if="${candidatures.isEmpty()}" class="text-center py-5">
        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No applications received yet</h5>
    </div>

    <div class="row g-3" th:unless="${candidatures.isEmpty()}">
        <div class="col-12" th:each="c : ${candidatures}">
            <div class="card-modern card p-4">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-3 mb-2">
                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                 style="width:44px;height:44px;background:var(--gradient);color:white;font-weight:700;font-size:1.1rem"
                                 th:text="${#strings.substring(c.candidat.prenom,0,1) + #strings.substring(c.candidat.nom,0,1)}">
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0"
                                    th:text="${c.candidat.prenom + ' ' + c.candidat.nom}"></h6>
                                <small class="text-muted" th:text="${c.candidat.email}"></small>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mb-3">
                            <span th:if="${c.statut.name() == 'EN_ATTENTE'}"
                                  class="badge-status-pending">
                                <i class="bi bi-hourglass me-1"></i>Pending
                            </span>
                            <span th:if="${c.statut.name() == 'ACCEPTEE'}"
                                  class="badge-status-accepted">
                                <i class="bi bi-check-circle me-1"></i>Accepted
                            </span>
                            <span th:if="${c.statut.name() == 'REFUSEE'}"
                                  class="badge-status-refused">
                                <i class="bi bi-x-circle me-1"></i>Refused
                            </span>
                            <small class="text-muted">
                                Applied
                                <span th:text="${#temporals.format(c.dateSoumission,'dd MMM yyyy')}"></span>
                            </small>
                        </div>
                        <div th:if="${c.lettreMotivation}" class="bg-light rounded-3 p-3 mb-3">
                            <small class="text-muted fw-600 d-block mb-1">COVER LETTER</small>
                            <p class="small mb-0" th:text="${c.lettreMotivation}"></p>
                        </div>
                    </div>
                </div>
               <div class="d-flex gap-2 flex-wrap">
    <!-- Accept/Refuse only when PENDING -->
    <form th:if="${c.statut.name() == 'EN_ATTENTE'}"
          th:action="@{/recruteur/candidatures/{id}/traiter(id=${c.id})}"
          method="post">
        <input type="hidden" name="offreId" th:value="${offreId}"/>
        <input type="hidden" name="statut" value="ACCEPTEE"/>
        <button type="submit" class="btn-primary-custom"
                style="padding:8px 18px;font-size:0.85rem">
            <i class="bi bi-check-lg me-1"></i>Accept
        </button>
    </form>
    <form th:if="${c.statut.name() == 'EN_ATTENTE'}"
          th:action="@{/recruteur/candidatures/{id}/traiter(id=${c.id})}"
          method="post">
        <input type="hidden" name="offreId" th:value="${offreId}"/>
        <input type="hidden" name="statut" value="REFUSEE"/>
        <button type="submit" class="btn btn-sm border"
                style="border-radius:10px;padding:8px 18px;color:#ef4444;border-color:#fecaca">
            <i class="bi bi-x-lg me-1"></i>Refuse
        </button>
    </form>

    <!-- Message always visible for PENDING and ACCEPTED -->
    <a th:if="${c.statut.name() == 'EN_ATTENTE' or c.statut.name() == 'ACCEPTEE'}"
       th:href="@{/messages/{id}(id=${c.id})}"
       class="btn-outline-custom" style="padding:8px 16px;font-size:0.85rem">
        <i class="bi bi-chat me-1"></i>Message
    </a>
</div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
