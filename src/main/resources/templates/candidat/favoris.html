<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Saved Jobs')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>Saved Jobs</h1>
        <p class="text-muted mb-0">Jobs you bookmarked for later</p>
    </div>
</div>

<div class="container mb-5">

    <!-- Toast notification -->
    <div id="toast" style="
        position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);
        background:#0f172a;color:white;padding:14px 24px;border-radius:14px;
        display:flex;align-items:center;gap:16px;z-index:9999;
        box-shadow:0 8px 30px rgba(0,0,0,0.2);
        transition:transform 0.3s ease;min-width:320px;">
        <i class="bi bi-check-circle-fill" style="color:#10b981;font-size:1.1rem"></i>
        <span id="toastMsg" style="flex:1;font-size:0.9rem"></span>
        <button id="undoBtn" onclick="undoRemove()"
                style="background:rgba(255,255,255,0.15);border:none;color:white;
                       padding:4px 12px;border-radius:8px;font-size:0.8rem;cursor:pointer;
                       font-weight:600">
            Undo
        </button>
        <button onclick="hideToast()"
                style="background:none;border:none;color:rgba(255,255,255,0.5);
                       cursor:pointer;font-size:1rem;padding:0">✕</button>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center py-5"
         th:style="${favoris.isEmpty()} ? '' : 'display:none'">
        <i class="bi bi-bookmark fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">You haven't saved any jobs yet.</h5>
        <p class="text-muted">Browse available jobs and save the ones you're interested in.</p>
        <a th:href="@{/offres}" class="btn-primary-custom d-inline-block mt-2">
            Browse Jobs
        </a>
    </div>

    <!-- Jobs grid -->
    <div class="row g-4" id="favoriGrid"
         th:style="${favoris.isEmpty()} ? 'display:none' : ''">
        <div class="col-md-6" th:each="f : ${favoris}"
             th:id="'card-' + ${f.offre.id}">
            <div class="card-modern card p-4 h-100">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <h6 class="fw-bold mb-1" th:text="${f.offre.titre}"></h6>
                        <p class="text-muted small mb-0"
                           th:text="${f.offre.entreprise.nom}"></p>
                    </div>
                    <button class="btn btn-sm border"
                            style="border-radius:8px;color:#ef4444;border-color:#fecaca;background:white"
                            title="Remove from saved"
                            th:onclick="'removeJob(' + ${f.offre.id} + ', this)'">
                        <i class="bi bi-bookmark-x"></i>
                    </button>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <span class="badge-city" th:if="${f.offre.ville}"
                          th:text="${f.offre.ville}"></span>
                    <span class="badge-contract"
                          th:text="${f.offre.typeContrat}"></span>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-auto">
                    <small class="text-muted">
                        <i class="bi bi-bookmark me-1"></i>
                        Saved on
                        <span th:text="${#temporals.format(f.dateAjout,'dd MMM yyyy')}"></span>
                    </small>
                    <a th:href="@{/offres/{id}(id=${f.offre.id})}"
                       class="btn-primary-custom"
                       style="padding:8px 16px;font-size:0.85rem">
                        View Job
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>

<th:block th:replace="~{layout/base :: scripts}"></th:block>

<script>
    let lastRemovedId = null;
    let lastRemovedCard = null;
    let undoTimer = null;

    function removeJob(offreId, btn) {
        const card = document.getElementById('card-' + offreId);
        if (!card) return;

        // Save for undo
        lastRemovedId = offreId;
        lastRemovedCard = card.cloneNode(true);

        // Hide card instantly
        card.style.transition = 'all 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';
        setTimeout(() => {
            card.remove();
            checkEmpty();
        }, 300);

        // Show toast
        showToast('Job removed from saved jobs.', true);

        // Auto-confirm after 7 seconds
        undoTimer = setTimeout(() => {
            confirmRemove(offreId);
        }, 7000);
    }

    function confirmRemove(offreId) {
        fetch('/candidat/favoris/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'offreId=' + offreId + '&from=favoris'
        });
        lastRemovedId = null;
        lastRemovedCard = null;
    }

    function undoRemove() {
        if (!lastRemovedId || !lastRemovedCard) return;

        clearTimeout(undoTimer);

        // Restore card
        const grid = document.getElementById('favoriGrid');
        const col = document.createElement('div');
        col.className = 'col-md-6';
        col.id = 'card-' + lastRemovedId;
        col.innerHTML = lastRemovedCard.innerHTML;
        col.style.opacity = '0';
        col.style.transition = 'all 0.3s ease';
        grid.appendChild(col);

        setTimeout(() => {
            col.style.opacity = '1';
            grid.style.display = '';
            document.getElementById('emptyState').style.display = 'none';
        }, 50);

        showToast('Job restored to saved jobs.', false);
        lastRemovedId = null;
        lastRemovedCard = null;
    }

    function checkEmpty() {
        const grid = document.getElementById('favoriGrid');
        const cards = grid.querySelectorAll('[id^="card-"]');
        if (cards.length === 0) {
            grid.style.display = 'none';
            document.getElementById('emptyState').style.display = '';
        }
    }

    function showToast(msg, showUndo) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        document.getElementById('undoBtn').style.display = showUndo ? 'block' : 'none';
        toast.style.transform = 'translateX(-50%) translateY(0)';

        setTimeout(() => {
            hideToast();
        }, 7000);
    }

    function hideToast() {
        document.getElementById('toast').style.transform =
            'translateX(-50%) translateY(100px)';
    }
</script>
</body>
</html>
