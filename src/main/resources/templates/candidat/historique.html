<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My Applications')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>My Applications</h1>
        <p class="text-muted mb-0">Track the status of all your job applications</p>
    </div>
</div>

<div class="container mb-5">

    <div th:if="${success}" class="alert border-0 rounded-3 mb-4"
         style="background:#f0fdf4; color:#16a34a;">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${candidatures.isEmpty()}" class="text-center py-5">
        <i class="bi bi-file-text fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No applications yet</h5>
        <p class="text-muted">Start applying to jobs!</p>
        <a th:href="@{/offres}" class="btn-primary-custom d-inline-block mt-2">
            Browse Jobs
        </a>
    </div>

    <div class="row g-3" th:unless="${candidatures.isEmpty()}">
        <div class="col-12" th:each="c : ${candidatures}">
            <div class="card-modern card p-4">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">

                    <!-- Job info -->
                    <div>
                        <h6 class="fw-bold mb-1" th:text="${c.offre.titre}"></h6>
                        <p class="text-muted small mb-2"
                           th:text="${c.offre.entreprise.nom + ' · ' + c.offre.ville}"></p>
                        <small class="text-muted">
                            <i class="bi bi-calendar me-1"></i>
                            Applied on
                            <span th:text="${#temporals.format(c.dateSoumission,'dd MMM yyyy')}"></span>
                        </small>
                    </div>

                    <!-- Status + actions -->
                    <div class="d-flex flex-column align-items-end gap-2">

                        <!-- Status badge -->
                        <span th:switch="${c.statut.name()}">
                            <span th:case="'APPLIED'" class="badge rounded-pill"
                                  style="background:#e0e7ff;color:#4f46e5;padding:6px 14px;font-size:0.8rem">
                                📋 Applied
                            </span>
                            <span th:case="'REVIEWED'" class="badge rounded-pill"
                                  style="background:#fef3c7;color:#d97706;padding:6px 14px;font-size:0.8rem">
                                👁 Reviewed
                            </span>
                            <span th:case="'SHORTLISTED'" class="badge rounded-pill"
                                  style="background:#dbeafe;color:#2563eb;padding:6px 14px;font-size:0.8rem">
                                ⭐ Shortlisted
                            </span>
                            <span th:case="'INTERVIEW_SCHEDULED'" class="badge rounded-pill"
                                  style="background:#d1fae5;color:#059669;padding:6px 14px;font-size:0.8rem">
                                📅 Interview Scheduled
                            </span>
                            <span th:case="'INTERVIEW_COMPLETED'" class="badge rounded-pill"
                                  style="background:#ede9fe;color:#7c3aed;padding:6px 14px;font-size:0.8rem">
                                ✅ Interview Done
                            </span>
                          
                            <span th:case="'HIRED'" class="badge rounded-pill"
                                  style="background:#d1fae5;color:#065f46;padding:6px 14px;font-size:0.8rem;font-weight:700">
                                🎉 Hired
                            </span>
                            <span th:case="'REJECTED'" class="badge rounded-pill"
                                  style="background:#fee2e2;color:#dc2626;padding:6px 14px;font-size:0.8rem">
                                ❌ Rejected
                            </span>
                        </span>

                        <!-- Message button -->
                        <a th:if="${c.statut.name() != 'REJECTED'}"
                           th:href="@{/messages/{id}(id=${c.id})}"
                           class="btn-outline-custom"
                           style="padding:6px 14px;font-size:0.8rem">
                            <i class="bi bi-chat me-1"></i>Message
                        </a>
                    </div>
                </div>

                <!-- Interview details if scheduled -->
                <div th:if="${c.statut.name() == 'INTERVIEW_SCHEDULED' or c.statut.name() == 'INTERVIEW_COMPLETED'}"
                     class="mt-3 p-3 rounded-3"
                     style="background:#f0fdf4;border:1px solid #bbf7d0">
                    <small class="fw-600 text-muted d-block mb-2">
                        <i class="bi bi-calendar-event me-1"></i>INTERVIEW DETAILS
                    </small>
                    <div th:each="entry : ${interviewMap}"
                         th:if="${entry.key == c.id}">
                        <div class="d-flex flex-wrap gap-4 small">
                            <div>
                                <i class="bi bi-calendar me-1 text-muted"></i>
                                <span th:text="${#temporals.format(entry.value.interviewDate,'dd MMM yyyy')}"></span>
                            </div>
                            <div>
                                <i class="bi bi-clock me-1 text-muted"></i>
                                <span th:text="${entry.value.interviewTime}"></span>
                            </div>
                            <div>
                                <i class="bi bi-geo-alt me-1 text-muted"></i>
                                <span th:text="${entry.value.location}"></span>
                            </div>
                            <div th:if="${entry.value.interviewer}">
                                <i class="bi bi-person me-1 text-muted"></i>
                                <span th:text="${entry.value.interviewer}"></span>
                            </div>
                        </div>
                        <div th:if="${entry.value.notes}" class="mt-2 text-muted small">
                            <i class="bi bi-sticky me-1"></i>
                            <span th:text="${entry.value.notes}"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
