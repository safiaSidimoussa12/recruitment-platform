<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My Applications')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>My Applications</h1>
        <p class="text-muted mb-0">Track the status of all your job applications</p>
    </div>
</div>

<div class="container mb-5">
    <div th:if="${param.success}" class="alert border-0 rounded-3 mb-4"
         style="background:#f0fdf4; color:#16a34a;">
        <i class="bi bi-check-circle me-2"></i>Application submitted successfully!
    </div>

    <div th:if="${candidatures.isEmpty()}" class="text-center py-5">
        <i class="bi bi-file-text fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No applications yet</h5>
        <p class="text-muted">Start applying to jobs!</p>
        <a th:href="@{/offres}" class="btn-primary-custom d-inline-block mt-2">
            Browse Jobs
        </a>
    </div>

    <div class="row g-3" th:unless="${candidatures.isEmpty()}">
        <div class="col-12" th:each="c : ${candidatures}">
            <div class="card-modern card p-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-1" th:text="${c.offre.titre}"></h6>
                        <p class="text-muted small mb-2"
                           th:text="${c.offre.entreprise.nom} + ' · ' + ${c.offre.ville}"></p>
                        <small class="text-muted">
                            <i class="bi bi-calendar me-1"></i>
                            Applied on
                            <span th:text="${#temporals.format(c.dateSoumission,'dd MMM yyyy')}"></span>
                        </small>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <span th:if="${c.statut.name() == 'EN_ATTENTE'}"
                              class="badge-status-pending">
                            <i class="bi bi-hourglass me-1"></i>Pending
                        </span>
                        <span th:if="${c.statut.name() == 'ACCEPTEE'}"
                              class="badge-status-accepted">
                            <i class="bi bi-check-circle me-1"></i>Accepted
                        </span>
                        <span th:if="${c.statut.name() == 'REFUSEE'}"
                              class="badge-status-refused">
                            <i class="bi bi-x-circle me-1"></i>Refused
                        </span>
                        <a th:href="@{/messages/{id}(id=${c.id})}"
                           class="btn-outline-custom" style="padding:6px 14px;font-size:0.85rem">
                            <i class="bi bi-chat me-1"></i>Message
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
