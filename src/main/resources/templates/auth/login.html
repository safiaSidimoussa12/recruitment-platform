<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Sign In')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card card">
                    <div class="auth-header">
                        <i class="bi bi-briefcase-fill fs-1 mb-3 d-block"></i>
                        <h3 class="fw-800 mb-1">Welcome back</h3>
                        <p class="opacity-75 mb-0">Sign in to your JobBoard account</p>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert border-0 rounded-3 mb-4"
                             style="background:#fef2f2; color:#dc2626;">
                            <i class="bi bi-exclamation-circle me-2"></i>
                            Invalid email or password.
                        </div>
                        <div th:if="${param.registered}" class="alert border-0 rounded-3 mb-4"
                             style="background:#f0fdf4; color:#16a34a;">
                            <i class="bi bi-check-circle me-2"></i>
                            Account created! You can now sign in.
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-600 text-muted small">EMAIL</label>
                                <input type="email" name="username" class="form-control form-control-modern"
                                       placeholder="you@example.com" required/>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-600 text-muted small">PASSWORD</label>
                                <input type="password" name="password"
                                       class="form-control form-control-modern"
                                       placeholder="••••••••" required/>
                            </div>
                            <button type="submit" class="btn-primary-custom w-100 d-block text-center">
                                Sign In <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </form>
                        <hr class="my-4"/>
                        <p class="text-center text-muted mb-0">
                            Don't have an account?
                            <a th:href="@{/register}" style="color:var(--primary); font-weight:600;">
                                Register
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
