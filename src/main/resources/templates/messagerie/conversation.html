<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Messages')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>Messages</h1>
        <p class="text-muted mb-0">Conversation with the recruiter</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-modern card" style="overflow:hidden">
                <div class="p-3 border-bottom"
                     style="background:var(--gradient-soft)">
                    <h6 class="fw-bold mb-0">
                        <i class="bi bi-chat-dots me-2" style="color:var(--primary)"></i>
                        Conversation
                    </h6>
                </div>

                <div class="p-4" style="height:420px;overflow-y:auto;" id="chatBox">
                    <div th:if="${messages.isEmpty()}" class="text-center py-5 text-muted">
                        <i class="bi bi-chat fs-1 d-block mb-2"></i>
                        No messages yet. Start the conversation!
                    </div>
                    <div th:each="m : ${messages}" class="mb-3">
                        <div class="d-flex gap-3">
                            <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                 style="width:36px;height:36px;background:var(--gradient);color:white;font-weight:700;font-size:0.8rem"
                                 th:text="${#strings.substring(m.expediteur.email,0,1).toUpperCase()}">
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex gap-2 align-items-baseline mb-1">
                                    <small class="fw-600"
                                           th:text="${m.expediteur.email}"></small>
                                    <small class="text-muted"
                                           th:text="${#temporals.format(m.dateEnvoi,'dd MMM, HH:mm')}"></small>
                                </div>
                                <div class="p-3 rounded-3"
                                     style="background:#f8fafc;border:1px solid #e2e8f0">
                                    <p class="mb-0 small" th:text="${m.contenu}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 border-top" style="background:#f8fafc">
                    <form th:action="@{/messages/{id}(id=${candidatureId})}" method="post">
                       <input type="hidden" name="destinataireId" th:value="${destinataireId}"/>
                        <div class="d-flex gap-3">
                            <textarea name="contenu" class="form-control form-control-modern"
                                      rows="2" placeholder="Type your message..." required
                                      style="resize:none"></textarea>
                            <button type="submit" class="btn-primary-custom flex-shrink-0"
                                    style="padding:8px 20px">
                                <i class="bi bi-send"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>

<script>
    const box = document.getElementById('chatBox');
    if (box) box.scrollTop = box.scrollHeight;
</script>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
