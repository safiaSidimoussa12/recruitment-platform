<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Manage Companies')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1>Manage Companies</h1>
            <p class="text-muted mb-0">Review and moderate company accounts</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn-outline-custom">← Dashboard</a>
    </div>
</div>

<div class="container mb-5">
    <div class="card-modern card">
        <div class="card-body p-0">
            <table class="table table-modern mb-0">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Sector</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${entreprises}">
                        <td class="fw-600" th:text="${e.nom}"></td>
                        <td class="text-muted" th:text="${e.secteur} ?: '—'"></td>
                        <td class="text-muted" th:text="${e.localisation} ?: '—'"></td>
                        <td>
                            <span th:if="${e.statut.name() == 'ACTIVE'}"
                                  class="badge-status-accepted">Active</span>
                            <span th:unless="${e.statut.name() == 'ACTIVE'}"
                                  class="badge-status-refused">Suspended</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/entreprises/{id}/suspendre(id=${e.id})}"
                                  method="post">
                                <button type="submit" class="btn btn-sm border"
                                        style="border-radius:8px;color:#d97706;border-color:#fde68a">
                                    <i class="bi bi-pause-circle me-1"></i>Suspend
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
