<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="page-header">
    <div class="container">
        <h1>Admin Dashboard</h1>
        <p class="text-muted mb-0">Platform overview and management</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card"
                 style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">
                <i class="bi bi-people fs-2 mb-2 d-block opacity-75"></i>
                <h2 class="fw-bold mb-1" th:text="${totalUtilisateurs}">0</h2>
                <p class="opacity-75 mb-0">Total Users</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card"
                 style="background:linear-gradient(135deg,#ec4899,#f43f5e)">
                <i class="bi bi-building fs-2 mb-2 d-block opacity-75"></i>
                <h2 class="fw-bold mb-1" th:text="${totalEntreprises}">0</h2>
                <p class="opacity-75 mb-0">Companies</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card"
                 style="background:linear-gradient(135deg,#06b6d4,#0ea5e9)">
                <i class="bi bi-briefcase fs-2 mb-2 d-block opacity-75"></i>
                <h2 class="fw-bold mb-1">—</h2>
                <p class="opacity-75 mb-0">Active Jobs</p>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <a th:href="@{/admin/utilisateurs}" class="card-modern card p-4 text-decoration-none d-block">
                <i class="bi bi-people fs-3 mb-3 d-block" style="color:var(--primary)"></i>
                <h6 class="fw-bold mb-1">Manage Users</h6>
                <p class="text-muted small mb-0">View, activate or suspend accounts</p>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/admin/entreprises}" class="card-modern card p-4 text-decoration-none d-block">
                <i class="bi bi-building fs-3 mb-3 d-block" style="color:var(--secondary)"></i>
                <h6 class="fw-bold mb-1">Manage Companies</h6>
                <p class="text-muted small mb-0">Review and moderate companies</p>
            </a>
        </div>
    </div>
</div>

<footer class="footer-custom">
    <div class="container"><p class="mb-0">© 2026 JobBoard</p></div>
</footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
